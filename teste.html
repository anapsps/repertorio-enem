<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste</title>
</head>
<body>
    <h1 id="titulo">Teste de JavaScript</h1>
    <input type="text" id="campo" placeholder="Digite aqui">
    <p id="saida">Ainda não digitou nada.</p>
    <button type="button" id="botao">Clique aqui</button>

    <script>
        document.getElementById("botao").addEventListener("click", function () {
            document.getElementById("titulo").textContent = "O JAVASCRIPT FUNCIONA!";
        });
        document.getElementById("campo").addEventListener("input", function () {
            document.getElementById("saida").textContent = "Você digitou: " + this.value;
        });
    </script>
</body>
</html>
