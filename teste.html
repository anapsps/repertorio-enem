<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste</title>
</head>
<body style="font-family: Arial; padding: 40px;">
    <h1>TESTE 1</h1>
    <p>Passe o mouse sobre o link:</p>
    <a href="index.html" title="Se você está vendo isto colado no mouse, o código funciona">Passe o mouse aqui</a>

    <script>
    var tip = document.createElement("div");
    tip.style.cssText = "position:fixed; max-width:230px; padding:8px 12px; background:#0F3D63; color:#fff; font-size:13px; border-radius:8px; pointer-events:none; opacity:0; z-index:1000;";
    document.body.appendChild(tip);

    document.querySelectorAll("a[title]").forEach(function (link) {
        link.dataset.tip = link.title;
        link.removeAttribute("title");
        link.addEventListener("mouseenter", function () {
            tip.textContent = link.dataset.tip;
            tip.style.opacity = "1";
        });
        link.addEventListener("mousemove", function (e) {
            tip.style.left = (e.clientX + 15) + "px";
            tip.style.top = (e.clientY + 15) + "px";
        });
        link.addEventListener("mouseleave", function () {
            tip.style.opacity = "0";
        });
    });
    </script>
</body>
</html>
